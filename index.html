<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9eb4ba" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23bdd3d5' d='M0 0h64v38H0z'/%3E%3Cpath fill='%23476f76' d='M0 28q16-8 32 0t32 0v36H0z'/%3E%3Cpath fill='%23b89b6a' d='M0 46q18-9 34-2t30-1v21H0z'/%3E%3C/svg%3E" />
    <title>Shoreline Vlog Renderer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1418;
        color: #f2f5f4;
      }
      * { box-sizing: border-box; }
      html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: radial-gradient(circle at 50% 30%, #58737a, #0b1418 72%); }
      canvas { display: block; width: 100%; height: 100%; }
      .status-card {
        position: fixed;
        z-index: 4;
        top: 18px;
        left: 18px;
        width: min(360px, calc(100vw - 36px));
        padding: 13px 15px;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 12px;
        background: rgb(9 18 22 / 76%);
        box-shadow: 0 10px 32px rgb(0 0 0 / 24%);
        backdrop-filter: blur(14px);
        transition: opacity 180ms ease;
      }
      .status-card[data-state="ready"] { border-color: rgb(178 218 207 / 38%); }
      .status-card[data-state="degraded"] { border-color: rgb(247 196 92 / 58%); }
      .status-card[data-state="fatal"] { border-color: rgb(255 113 105 / 70%); }
      .status-heading { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: 0.02em; }
      .status-detail { margin: 5px 0 0; color: rgb(238 244 243 / 72%); font-size: 12px; line-height: 1.45; }
      .timeline {
        position: fixed;
        z-index: 4;
        right: 18px;
        bottom: 18px;
        display: grid;
        min-width: 250px;
        gap: 9px;
        padding: 12px 14px;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 12px;
        background: rgb(9 18 22 / 68%);
        backdrop-filter: blur(12px);
      }
      .timeline-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .shot-name { color: rgb(243 246 245 / 82%); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
      .timecode { color: rgb(243 246 245 / 62%); font-variant-numeric: tabular-nums; font-size: 11px; }
      .progress { height: 2px; overflow: hidden; border-radius: 2px; background: rgb(255 255 255 / 16%); }
      .progress > span { display: block; width: 0; height: 100%; background: #d7e9e1; transform-origin: left; }
      button, .download-link {
        appearance: none;
        border: 1px solid rgb(255 255 255 / 24%);
        border-radius: 7px;
        padding: 7px 10px;
        background: rgb(255 255 255 / 8%);
        color: inherit;
        font: inherit;
        font-size: 11px;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }
      button:hover, .download-link:hover { background: rgb(255 255 255 / 14%); }
      button:disabled { cursor: progress; opacity: 0.58; }
      .capture-clean .status-card, .capture-clean .timeline { opacity: 0; pointer-events: none; }
      .fatal-backdrop { position: fixed; inset: 0; background: rgb(17 10 10 / 44%); pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { .status-card { transition: none; } }
    </style>
  </head>
  <body>
    <main id="app" aria-label="Shoreline cinematic"></main>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
